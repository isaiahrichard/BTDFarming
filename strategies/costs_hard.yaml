village_discount:
  monkey_business:   # bottom tier 1 (0-0-1)
    percent: 10
    applies_to: "base tower purchase + upgrades of tier 1, 2 and 3. Tier 4 and 5 upgrades get no discount"
    base_tower: >-
      Yes, but the wiki says it works as a refund: "gives a 10% refund on the purchase of base towers and Heroes
      placed within said radius". So you pay the full price and get 10% back once the tower is placed inside the radius.
      The bot's cash check should use the full price for placements.
    heroes: "the placement is refunded 10% (same sentence). Hero level-ups are not discounted"
    stacking: "Does not stack. Several Monkey Business villages still give only 10%"
  monkey_commerce:   # bottom tier 2 (0-0-2)
    percent: 5   # added on top of Business, so one 0-0-2 village gives 15%
    applies_to: "same as Business: base tower + tier 1-3 upgrades only"
    stacking: >-
      The +5% stacks additively with up to 2 other Commerce villages (in-game: "can stack with up to 2 other Villages
      with this upgrade"). Max is 10 + 3x5 = 25% for a tower inside the overlap of 3 Commerce villages.
  max_total_percent: 25
  rounding: >-
    Wiki (Discount page): "all Upgrades can only be Discounted to Prices that end in 0 or 5. This is because of
    rounding. Rounding equation impending." Module:PricesBTD6 says the in-between cases come from village discounts:
    "Numbers ending in 2.5 round down, while 7.5 round up".  # ? exact formula not on the wiki. Unknown whether the % comes off the Hard price or the Medium price before x1.08. Best guess: round5(hard_price x (1 - pct)), with x2.5 rounding down and x7.5 rounding up. Check one case in-game, e.g. a Druid upgrade read off the panel.
  range_condition: >-
    The in-game text says the discount is on purchases made "in the radius of the Village". For village buffs a tower
    counts as in range when the centre of its footprint is inside the village radius (Range page). Because it applies
    at purchase time, cash spent before the village or its 0-0-1/0-0-2 upgrade was bought is not refunded.  # ? the wiki doesn't say in so many words that it's not retroactive; that follows from "purchased"/"refund on placement"
  self_discount: "unknown"   # ? the wiki says nearby villages make each other's upgrades cheaper, but doesn't say whether a village discounts its own upgrades
  chimps: >-
    Allowed in CHIMPS. Discount page: Discount "is not banned on CHIMPS Mode". Monkey Commerce page recommends it
    especially for CHIMPS. The Insider Trades Monkey Knowledge (Business 10% -> 12%) is off because CHIMPS disables
    Monkey Knowledge. Monkey Town's cash-per-pop does nothing in CHIMPS (removed in v1.5).
  notes: >-
    In this run, village1 goes to 0-0-2 before the druid upgrades at r25-30, so every druid/alchemist/glue placement
    and tier-1-3 upgrade bought inside its radius afterwards should cost 15% less (one village). Druid tier 4/5
    (Poplust 2540, Avatar of Wrath 48600, Ball Lightning 4860) and Alchemist tier 4/5 stay full price. Sniper, sub and
    the skywardens were bought before the village, and Obyn is a hero.
village_range:
  units: "game units (wiki: range numbers are not pixels; BTD6 uses grid units that scale with resolution)"
  base: 40
  bigger_radius: {add: 8, total: 48}       # 1-x-x: "+8, from 40 units to 48 units"
  jungle_drums: {add: 0, total: 48}        # 2-x-x adds no range (+18% attack speed only); its infobox range is still 48
  # For reference: Monkey City (x-x-4) +10, Primary Expertise (5-x-x) +8 more. Skywarden 3xx gives villages a range buff (v57.2 note).
  map_width_units: 286   # Range page: "the range of an entire in-game map is approximately 286 units wide"
  px_per_unit: null      # ? no pixel conversion on the wiki. Estimate = (on-screen map width in px) / 286, then measure a village's range circle in a screenshot to check
