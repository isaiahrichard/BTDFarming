# plus the v57.x price changes from the wiki's v57.x balance-changes page (only Glue Gunner + Skywarden affected).
# `cost` = Hard price computed with the wiki's own rule (see hard_rule); `medium` = wiki Medium price it came from.
# Checked against every Hard price the wiki hard-codes (infobox base costs, cost-hard overrides, Obyn): all agree.
# Prices exclude Monkey Knowledge (disabled in CHIMPS) and village discounts.
