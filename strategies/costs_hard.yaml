hard_rule: >-
  Hard = Medium x 1.08 (Difficulty page: "Tower and upgrade costs are increased by 8%"), rounded to a multiple of $5.
  Exact rounding from Module:PricesBTD6 RoundToFive: drop the decimals first (floor), then round to the nearest 5.
  No ties are possible after the floor, e.g. 162.0 -> 160, 351 -> 350, 1296 -> 1295, 8208 -> 8210.
  (Easy x0.85, Impoppable x1.2 use the same rounding.)
